name: Python Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Python 3.12 / portable tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Prepare isolated test configuration
        run: cp config.example.yaml config.yaml
      - name: Run portable unit tests
        run: python -m pytest -q -m "not integration and not cloud and not e2e" tests --ignore=tests/e2e

  certificate-chain-integration:
    name: Python 3.12 / public CA integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install minimal certificate-chain dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "httpx>=0.26" "cryptography>=50.0.2"
      - name: Verify live ZeroSSL CA chain
        run: python -m pytest -q -m integration tests/test_zerossl_chain.py
