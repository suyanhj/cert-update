name: Certificate Chain Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  certificate-chain:
    name: Python 3.12 / certificate-chain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "httpx>=0.26" "cryptography>=50.0.2"

      - name: Run ZeroSSL certificate-chain tests
        run: python -m pytest -q -m "not integration" tests/test_zerossl_chain.py

      - name: Run ZeroSSL integration test against official CA endpoints
        run: python -m pytest -q -m integration tests/test_zerossl_chain.py
