acme:
  # 证书存储目录，默认相对项目根目录
  cert_storage_path: ./certs
  # acme.sh 可执行文件路径（生产环境使用）
  acme_sh_path: ~/.acme.sh/acme.sh
  # 证书路径模式：auto=自定义/记录/default 依次识别，default=acme.sh 默认目录，custom=Le_Real* 部署路径
  certificate_path_mode: auto
  # 单次 acme.sh 命令最长执行时间，超时会终止进程并告警
  command_timeout_seconds: 900
  # 续签 --renew 时等待 DNS TXT 记录传播（秒），对应 acme.sh --dnssleep；0 表示不传
  dns_sleep_seconds: 60

