deploy:
  # 部署模式：dry-run 只输出计划，apply 会实际调用云 API / SSH 部署
  mode: dry-run
  # 证书续签冷却时间（单位：天）；成功续签后，在该时间窗口内再次触发会被跳过（force=true 时忽略）
  renew_cooldown_days: 7
  # 单次续签触发内最大重试次数（包含首次尝试）；失败会在该次数内重试
  max_renew_retries: 5
  # 续签失败时两次重试之间的等待时间（秒，<=0 表示不等待；线上建议设置为较大的值避免频繁打爆 API）
  renew_retry_interval_seconds: 10
  binding_cache:
    # 是否启用云产品绑定缓存（本地缓存 CDN/OSS/LB 与域名的关系）
    # 三态行为矩阵：
    #   enabled=true  + verify_before_apply=true ：匹配读缓存；apply 前实时拉 binding 做存在性校验，
    #                                              缺失 skip+钉钉 WARNING；存在则用实时字段填充后部署。
    #                                              verify 拉到的实时数据仅用于本次部署，不回写缓存
    #                                              （缓存仅由 product_scan 刷新）
    #   enabled=true  + verify_before_apply=false：完全以缓存为准，apply 前不做实时校验
    #   enabled=false + (verify_before_apply 任意值)：直接实时扫描匹配，跳过 verify 阶段
    enabled: true
    # 缓存有效期（秒），必须为正数
    ttl_seconds: 3600
    # apply 前是否做一次实时存在性校验（仅在 enabled=true 时生效）
    verify_before_apply: true

alert:
  # 证书到期告警阈值
  cert:
    enabled: true
    cert_warn_days: 15
    cert_expiry_days: 28
  # 域名到期告警阈值
  domain:
    enabled: true
    domain_warn_days: 15
    domain_expiry_days: 28
  # ECS 到期/续费告警阈值
  ecs:
    enabled: true
    ecs_warn_days: 15
    ecs_expiry_days: 28

# 告警白名单：在此列表中的域名不会触发证书/域名到期告警
whitelist: []

# DNS 多平台同时残留同名 Zone 时，可按根域名指定实际托管账号；一般无需配置，系统优先查询公网权威 NS。
domain_dns_overrides: {}
# domain_dns_overrides:
#   example.com: cloudflare-demo

staging:
  # 是否启用 staging 模式（仅用于测试，不要在生产开启）
  enabled: false
  # staging 下是否用本地自签证书模拟续签（true=local self-signed，false=仍调用 acme.sh）
  use_self_signed: true

product_scan:
  # 各云厂商产品扫描开关，用于控制是否扫描 CDN/OSS/LB/WAF/ECS/域名
  aliyun:
    cdn_scan: true
    oss_scan: true
    lb_scan: false
    ecs_scan: true        # 是否采集 ECS 实例
    domain_scan: true     # 是否采集云上域名
  huawei:
    cdn_scan: true
    oss_scan: false
    lb_scan: true
    waf_scan: true       # 扫描并部署云模式 WAF HTTPS 防护域名证书
    ecs_scan: false
    domain_scan: false
  tencent:
    # 腾讯云 apply 部署走上传证书后的 SSL Host 扫描，以下开关仅控制 SSL 部署扫描范围（非本地绑定缓存）。
    cdn_scan: true
    live_scan: true
    eo_scan: true          # 扫描并通过腾讯云 SSL 部署 EdgeOne 域名证书
    oss_scan: true
    lb_scan: false
    ecs_scan: false
    domain_scan: true
  volcengine:
    cdn_scan: false
    oss_scan: false
    lb_scan: false
  qiniu:
    # 七牛云接入 CDN 与 Kodo 对象存储加速域名。
    cdn_scan: true
    live_scan: false
    eo_scan: false
    oss_scan: true
    lb_scan: false
    ecs_scan: false
    domain_scan: false
  cloudflare:
    # Cloudflare 当前只读取 Zone/DNS；TXT 写入由后续签发流程中的 acme.sh dns_cf 完成。
    cdn_scan: false
    live_scan: false
    eo_scan: false
    oss_scan: false
    lb_scan: false
    ecs_scan: false
    domain_scan: true

# 采集调度与自动续签
check_interval_minutes: 30      # 定时采集的间隔（分钟）
auto_renew_enabled: false       # 是否启用自动续签编排（采集后按阈值触发续签，并按 deploy.mode 执行）
auto_renew_days: 20             # 证书剩余多少天以内会自动尝试续签

# 探测参数
tls_scan_parallel: 10           # TLS 探测并发数
http_scan_parallel: 10          # HTTP / DNS 子域探测并发数
tls_timeout_seconds: 5          # TLS 探测超时时间（秒）
http_timeout_seconds: 2         # HTTP 探测超时时间（秒）
log_level: info                 # 全局日志级别：debug / info / warning / error
