<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180">
  <defs>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #111827; }
      .subtitle { font: 400 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #4b5563; }
      .node { fill: #f9fafb; stroke: #374151; stroke-width: 2; rx: 12; ry: 12; }
      .node-blue { fill: #eff6ff; stroke: #2563eb; }
      .node-green { fill: #ecfdf5; stroke: #059669; }
      .node-amber { fill: #fffbeb; stroke: #d97706; }
      .text { font: 600 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #374151; }
      .lane { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; rx: 14; ry: 14; }
      .lane-title { font: 700 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1f2937; }
      .arrow { stroke: #4b5563; stroke-width: 2.5; fill: none; marker-end: url(#arrowHead); }
      .arrow-dash { stroke: #6b7280; stroke-width: 2.2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="1180" fill="#f3f4f6"/>
  <text x="40" y="54" class="title">CRT 总览流程</text>
  <text x="40" y="84" class="subtitle">包含 Main / UI / Services 主流程与关键入口</text>

  <!-- Lanes -->
  <rect x="32" y="116" width="1616" height="150" class="lane"/>
  <text x="52" y="146" class="lane-title">A. 启动与调度</text>

  <rect x="32" y="286" width="1616" height="430" class="lane"/>
  <text x="52" y="316" class="lane-title">B. 周期采集 collect_all()</text>

  <rect x="32" y="736" width="1616" height="210" class="lane"/>
  <text x="52" y="766" class="lane-title">C. 续签与部署（手动/自动入口共用）</text>

  <!-- Section A -->
  <rect x="92" y="170" width="240" height="62" class="node node-blue"/>
  <text x="212" y="207" text-anchor="middle" class="text">main.py 启动</text>
  <text x="212" y="246" text-anchor="middle" class="small">handle_cli_args (-c/--config)</text>

  <rect x="422" y="170" width="270" height="62" class="node node-blue"/>
  <text x="557" y="207" text-anchor="middle" class="text">start_scheduler(interval)</text>

  <rect x="786" y="170" width="300" height="62" class="node node-blue"/>
  <text x="936" y="207" text-anchor="middle" class="text">循环触发 collect_all()</text>
  <text x="936" y="246" text-anchor="middle" class="small">on_shutdown: stop_scheduler</text>

  <path d="M332 201 L422 201" class="arrow"/>
  <path d="M692 201 L786 201" class="arrow"/>

  <!-- Section B -->
  <rect x="92" y="344" width="230" height="62" class="node node-green"/>
  <text x="207" y="381" text-anchor="middle" class="text">collect_all()</text>

  <rect x="400" y="344" width="260" height="62" class="node node-green"/>
  <text x="530" y="381" text-anchor="middle" class="text">collect_domains()</text>

  <rect x="738" y="344" width="290" height="62" class="node node-green"/>
  <text x="883" y="381" text-anchor="middle" class="text">refresh_product_bindings_cache()</text>

  <rect x="1106" y="344" width="260" height="62" class="node node-green"/>
  <text x="1236" y="381" text-anchor="middle" class="text">collect_certificates()</text>

  <path d="M322 375 L400 375" class="arrow"/>
  <path d="M660 375 L738 375" class="arrow"/>
  <path d="M1028 375 L1106 375" class="arrow"/>

  <rect x="382" y="455" width="296" height="58" class="node"/>
  <text x="530" y="489" text-anchor="middle" class="small">Domains.discovery_all()</text>

  <rect x="382" y="542" width="296" height="58" class="node"/>
  <text x="530" y="576" text-anchor="middle" class="small">DomainDiscoveryService.discover_all()</text>

  <rect x="724" y="455" width="330" height="58" class="node"/>
  <text x="889" y="489" text-anchor="middle" class="small">ProviderRegistry + Providers 发现域名</text>

  <rect x="724" y="542" width="330" height="58" class="node"/>
  <text x="889" y="576" text-anchor="middle" class="small">归一化 + DomainProviderStore 落盘</text>

  <rect x="1086" y="455" width="280" height="58" class="node"/>
  <text x="1226" y="489" text-anchor="middle" class="small">DomainAlertService 告警</text>

  <rect x="1086" y="542" width="280" height="58" class="node"/>
  <text x="1226" y="576" text-anchor="middle" class="small">Certificates + TLS Probe + 证书告警</text>

  <path d="M530 406 L530 455" class="arrow"/>
  <path d="M530 513 L530 542" class="arrow"/>
  <path d="M678 484 L724 484" class="arrow"/>
  <path d="M678 571 L724 571" class="arrow"/>
  <path d="M1054 484 L1086 484" class="arrow"/>
  <path d="M1236 406 L1236 455" class="arrow"/>
  <path d="M1236 513 L1236 542" class="arrow"/>

  <text x="890" y="640" text-anchor="middle" class="subtitle">注意：refresh_product_bindings_cache 只刷新缓存，不做部署</text>

  <!-- Section C -->
  <rect x="92" y="806" width="278" height="62" class="node node-amber"/>
  <text x="231" y="843" text-anchor="middle" class="text">续签入口（UI手动 / 自动预留）</text>

  <rect x="438" y="806" width="260" height="62" class="node node-amber"/>
  <text x="568" y="843" text-anchor="middle" class="text">renew_certificate()</text>

  <rect x="770" y="806" width="300" height="62" class="node node-amber"/>
  <text x="920" y="843" text-anchor="middle" class="text">renew_flow.renew_and_plan_deploy()</text>

  <rect x="1142" y="785" width="210" height="52" class="node node-amber"/>
  <text x="1247" y="816" text-anchor="middle" class="small">deploy.mode=dry-run</text>

  <rect x="1142" y="852" width="210" height="52" class="node node-amber"/>
  <text x="1247" y="883" text-anchor="middle" class="small">deploy.mode=apply</text>

  <rect x="1416" y="785" width="190" height="52" class="node"/>
  <text x="1511" y="816" text-anchor="middle" class="small">DeployService.plan_dry_run</text>

  <rect x="1416" y="852" width="190" height="52" class="node"/>
  <text x="1511" y="883" text-anchor="middle" class="small">DeployService.apply_deploy</text>

  <path d="M370 837 L438 837" class="arrow"/>
  <path d="M698 837 L770 837" class="arrow"/>
  <path d="M1070 837 L1142 811" class="arrow"/>
  <path d="M1070 837 L1142 878" class="arrow"/>
  <path d="M1352 811 L1416 811" class="arrow"/>
  <path d="M1352 878 L1416 878" class="arrow"/>

  <path d="M1511 904 L1511 930 L231 930 L231 868" class="arrow-dash"/>
  <text x="860" y="922" text-anchor="middle" class="small">下一轮调度继续采集，形成闭环</text>

  <!-- Section D -->
  <rect x="32" y="956" width="1616" height="190" class="lane"/>
  <text x="52" y="986" class="lane-title">D. UI 与配置入口</text>

  <rect x="92" y="1010" width="260" height="62" class="node node-blue"/>
  <text x="222" y="1047" text-anchor="middle" class="text">UI 路由 / -> build_ui</text>

  <rect x="402" y="1010" width="260" height="62" class="node node-blue"/>
  <text x="532" y="1047" text-anchor="middle" class="text">/config -> build_config_ui</text>

  <rect x="712" y="1010" width="300" height="62" class="node node-amber"/>
  <text x="862" y="1047" text-anchor="middle" class="text">YAML 保存 -> apply_config_text</text>

  <rect x="1052" y="1010" width="280" height="62" class="node node-amber"/>
  <text x="1192" y="1047" text-anchor="middle" class="text">stop_scheduler -> start_scheduler</text>

  <path d="M662 1041 L712 1041" class="arrow"/>
  <path d="M1012 1041 L1052 1041" class="arrow"/>
  <text x="1192" y="1086" text-anchor="middle" class="small">配置生效后重启调度</text>
</svg>
