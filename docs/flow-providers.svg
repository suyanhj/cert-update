    <rect x="320" y="208" width="100" height="28" rx="4"/>
  </g>
  <text x="130" y="226" text-anchor="middle">get_domain_list</text>
  <text x="250" y="226" text-anchor="middle">get_*_bindings</text>
  <text x="370" y="226" text-anchor="middle">get_ecs_instances</text>
  <text x="130" y="258" text-anchor="middle" font-size="10" fill="#666">Domains</text>
  <text x="250" y="258" text-anchor="middle" font-size="10" fill="#666">DeployService</text>
  <text x="370" y="258" text-anchor="middle" font-size="10" fill="#666">Ecs</text>
</svg>
