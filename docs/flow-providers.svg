<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" font-family="sans-serif" font-size="12">
  <title>Providers 构建流程</title>
  <rect width="440" height="300" fill="#fafafa" stroke="#ccc" rx="4"/>
  <text x="220" y="22" text-anchor="middle" font-weight="bold">Providers 构建流程</text>
  <g fill="#e3f2fd" stroke="#1976d2">
    <rect x="120" y="38" width="200" height="24" rx="4"/>
    <rect x="120" y="70" width="200" height="24" rx="4"/>
    <rect x="120" y="102" width="200" height="24" rx="4"/>
    <rect x="120" y="134" width="200" height="24" rx="4"/>
  </g>
  <text x="220" y="54" text-anchor="middle">从 config.providers 加载配置</text>
  <text x="220" y="86" text-anchor="middle">normalize_provider_type(cfg.type)</text>
  <text x="220" y="118" text-anchor="middle">enabled=false 或 type=custom 则跳过</text>
  <text x="220" y="150" text-anchor="middle">build_provider(cfg, builder_map)</text>
